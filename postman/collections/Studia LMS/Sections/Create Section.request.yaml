$kind: http-request
name: Create Section
method: POST
url: '{{baseUrl}}/api/sections/'
order: 1000
description: 'Requires Profesor or Administrador role.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "courseId": "{{courseId}}",
      "title": "Module 1: Basics",
      "descriptionHtml": "<p>Introduction to the basics.</p>"
    }
