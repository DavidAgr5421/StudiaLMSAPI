$kind: http-request
name: Create Activity
method: POST
url: '{{baseUrl}}/api/activities/'
order: 1000
description: 'Creates an activity. type can be SoloTexto or ConArchivo. maxFiles is required when type is ConArchivo. Requires Profesor or Administrador role.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "sectionId": "{{sectionId}}",
      "title": "Assignment 1",
      "description": "Write a hello world program",
      "dueDateUtc": "2025-12-31T23:59:59Z",
      "type": "SoloTexto",
      "maxFiles": null
    }
