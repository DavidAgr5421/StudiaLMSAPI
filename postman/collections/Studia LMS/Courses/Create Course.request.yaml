$kind: http-request
name: Create Course
method: POST
url: '{{baseUrl}}/api/courses/'
order: 1000
description: 'Creates a new course. enrollmentMode can be Abierta, ConAprobacion, or PorInvitacion. Requires Profesor or Administrador role.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "name": "Introduction to Programming",
      "enrollmentMode": "Abierta"
    }
