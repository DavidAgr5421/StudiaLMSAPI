$kind: http-request
name: Create Cohort
method: POST
url: '{{baseUrl}}/api/cohorts/'
order: 1000
description: 'Requires Profesor or Administrador role.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "courseId": "{{courseId}}",
      "name": "Ficha 2024-A"
    }
