$kind: http-request
name: Assign Student to Cohort
method: POST
url: '{{baseUrl}}/api/cohorts/students'
order: 2000
description: 'Assigns a student to a cohort. Requires Profesor or Administrador role.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "cohortId": "{{cohortId}}",
      "studentId": "{{studentId}}"
    }
