$kind: http-request
name: Submit Text Activity
method: POST
url: '{{baseUrl}}/api/submissions/text'
order: 1000
description: 'Self-service: the authenticated student submits a text answer. StudentId is taken from the JWT.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "activityId": "{{activityId}}",
      "textContent": "My answer here..."
    }
