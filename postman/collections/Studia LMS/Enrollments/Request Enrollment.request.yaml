$kind: http-request
name: Request Enrollment
method: POST
url: '{{baseUrl}}/api/enrollments/requests'
order: 2000
description: 'Self-service: the authenticated student requests enrollment in a course that requires approval. StudentId is taken from the JWT.'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{authToken}}'
body:
  type: json
  content: |-
    {
      "courseId": "{{courseId}}"
    }
